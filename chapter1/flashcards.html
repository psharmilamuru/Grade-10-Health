<head>
<meta charset="UTF-8">

<title>Chapter 01 - Flashcards</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, "Noto Sans Tamil", sans-serif;
    background: #f5f7fb;
    color: #1f2937;
}
header {
    background: linear-gradient(135deg, #2563eb, #4f46e5);
    color: white;
    text-align: center;
    padding: 32px 20px;
}
header h1 { margin: 0 0 8px; font-size: 30px; }
header p { margin: 0; opacity: .95; }
.container {
    max-width: 850px;
    margin: 0 auto;
    padding: 30px 18px 45px;
}
.progress {
    text-align: center;
    color: #6b7280;
    margin-bottom: 15px;
    font-weight: bold;
}
.card {
    background: white;
    border-radius: 20px;
    padding: 34px 28px;
    min-height: 330px;
    box-shadow: 0 8px 25px rgba(0,0,0,.08);
    display: flex;
    flex-direction: column;
    justify-content: center;
}
.question-label {
    color: #2563eb;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 15px;
}
.question {
    font-size: 24px;
    line-height: 1.65;
    font-weight: bold;
}
.answer {
    display: none;
    margin-top: 25px;
    padding-top: 22px;
    border-top: 1px solid #e5e7eb;
    font-size: 18px;
    line-height: 1.75;
}
.show-btn {
    margin-top: 28px;
    align-self: center;
    border: 0;
    border-radius: 12px;
    padding: 13px 25px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
.controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 20px;
}
.controls button {
    border: 0;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}
.prev { background: #e5e7eb; color: #374151; }
.next { background: #2563eb; color: white; }
.back {
    display: block;
    text-align: center;
    margin-top: 22px;
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}
footer {
    text-align: center;
    color: #6b7280;
    padding: 25px 15px;
    font-size: 14px;
}
@media (max-width: 600px) {
    header h1 { font-size: 24px; }
    .card { padding: 25px 20px; min-height: 360px; }
    .question { font-size: 20px; }
    .answer { font-size: 16px; }
}
</style>
</head>

<header>
    <h1>🃏 Chapter 01 — Flashcards</h1>

</header>

<main class="container">
    <div class="progress" id="progress">1 / 75</div>

    <div class="controls">
        <button class="prev" onclick="previousCard()">← Previous</button>
        <button class="next" onclick="nextCard()">Next →</button>
    </div>

    <a class="back" href="index.html">← Back to Study Hub</a>
</main>

<footer>

<script>
const cards = [{"q": "உலக சுகாதார நிறுவனம் (WHO) ஆரோக்கியம் என்பதற்கு வழங்கும் வரைவிலக்கணம் யாது?", "a": "பூரண சுகாதாரம் (Complete Health) என்பது நோய்கள் அல்லது பலவீனங்கள் இல்லாத நிலை மாத்திரமன்றி உடல், உள, சமூக மற்றும் ஆன்மீக ரீதியான நல்வாழ்வையும் கொண்டதாகும்."}, {"q": "பூரண சுகாதாரத்தின் நான்கு பரிமாணங்கள் எவை?", "a": "உடல் ஆரோக்கியம், உள ஆரோக்கியம், சமூக ஆரோக்கியம் மற்றும் ஆன்மீக ஆரோக்கியம்."}, {"q": "பூரண சுகாதாரத்தில் செல்வாக்கு செலுத்தும் ஐந்து பிரதான காரணிகள் எவை?", "a": "பரம்பரை அலகு, தனிநபர் நடத்தைக் கோலம், சமூகப் பொருளாதாரச் சூழல், பௌதிகச் சூழல் மற்றும் சுகாதாரச் சேவை."}, {"q": "சுகாதாரச் சேவை (Health Services) என்பதன் கீழ் உள்ளடக்கப்படும் முக்கிய அம்சங்கள் எவை?", "a": "வைத்தியசாலைகள், தகுதியான வைத்தியர்கள், ஏனைய சுகாதார உத்தியோகத்தர்கள், தாய் - சேய் சுகாதார சேவை மற்றும் விசேட சுகாதார சேவைகள் போதியளவிலும் உயர் தரத்திலும் கிடைத்தல்."}, {"q": "பௌதிகச் சூழல் ஒருவரின் ஆரோக்கியத்தில் எவ்வாறு பங்களிக்கிறது?", "a": "பொருத்தமான காலநிலை, தூய நீர், தூய வளி, திட்டமிடப்பட்ட நகரமயமாக்கல் மற்றும் முறையான கழிவு மேலாண்மை ஆகியவற்றின் மூலம் பௌதிகச் சூழல் ஆரோக்கியத்தைப் பாதுகாக்கிறது."}, {"q": "பரம்பரை அலகு (Genetics) ஆரோக்கியத்தை எவ்வாறு பாதிக்கிறது?", "a": "நோய் ஏற்படக் காரணமான பரம்பரை அலகுகள் ஒருவரிடம் இல்லாமல் இருத்தல் பூரண சுகாதாரத்தை உறுதிப்படுத்த அவசியமான ஒரு காரணியாகும்."}, {"q": "சமூகப் பொருளாதாரச் சூழலுக்கு (Social and Economic Environment) உதாரணமாகக் கூறப்படுவன எவை?", "a": "நல்ல பொருளாதார நிலை, உயர் கல்வித் தரம், போதைப் பொருள் பாவனையைத் தடுத்தல், முறையான ஆளுமைத் தொடர்பு மற்றும் சண்டை சச்சரவுகள் அற்ற மன அமைதி."}, {"q": "தனிநபர் நடத்தைக் கோலத்திற்கு (Individual Behavior) உதாரணமாகக் கூறப்படுவன எவை?", "a": "சரியான உணவுப் பழக்கவழக்கம், போதுமான நித்திரை, ஓய்வு, உடற்பயிற்சி மற்றும் முறையற்ற பாலியல் தொடர்புகளைத் தவிர்த்தல்."}, {"q": "ஆரோக்கியமான சமூகமொன்றின் முக்கிய கூறுகளாகக் கருதப்படுபவை எவை?", "a": "நன்கு ஒழுங்கமைக்கப்பட்ட நோய்முற்காப்பு நடவடிக்கைகள், பொருத்தமான சுகாதார சேவைகள், சிறந்த சமூகப் பொருளாதாரப் பின்னணி மற்றும் சுத்தமான பௌதிகச் சூழல்."}, {"q": "பூரண சுகாதாரம் என்பது நோய் இல்லா நிலை மாத்திரமா? விளக்குக.", "a": "இல்லை, இது உடல், உள, சமூக மற்றும் ஆன்மீக ரீதியில் ஒருவர் சிறந்து விளங்கும் ஒட்டுமொத்த நல்நிலையையும் குறிக்கும்."}, {"q": "தேசியக் கொள்கைகளில் (National Policies) தங்கியுள்ள சுகாதாரக் காரணிகள் எவை?", "a": "சுகாதாரச் சேவை வழங்கல் மற்றும் நகரமயமாக்கலினால் ஏற்படும் பாதிப்புகளைக் கையாளுதல் போன்றவை தேசியக் கொள்கைகளில் தங்கியுள்ளன."}, {"q": "தனிநபர் ஒருவரால் மாற்றியமைக்கக் கூடிய பூரண சுகாதாரக் காரணிகள் எவை?", "a": "தனிநபர் நடத்தைக் கோலம் மற்றும் பௌதிகச் சூழலில் உள்ள சில குறிப்பிட்ட காரணிகளை ஒருவரால் தனது முயற்சியினால் மாற்றியமைக்க முடியும்."}, {"q": "சுகாதார மேம்பாடு குறித்த தெளிவு ஒரு மாணவருக்கு ஏன் அவசியம்?", "a": "பூரண சுகாதாரத்திற்குத் தடையாகவுள்ள காரணிகளை இனங்கண்டு, அவற்றை இழிவளவாக்குவதற்குத் தேவையான ஆரோக்கியமான வாழ்க்கை முறையைப் பின்பற்ற இத்தெளிவு அவசியம்."}, {"q": "நல்ல பொருளாதார நிலை சமூக ஆரோக்கியத்தை எவ்வாறு மேம்படுத்துகிறது?", "a": "சிறந்த போஷாக்கு, மேம்பட்ட சுகாதார வசதிகள் மற்றும் உயர்ந்த வாழ்க்கைத்தரத்தை உறுதிப்படுத்துவதன் மூலம் இது ஆரோக்கியத்திற்கு வழிவகுக்கிறது."}, {"q": "'முறையான ஆளுமைத் தொடர்பு' என்பது பூரண சுகாதாரத்தின் எக்காரணியின் கீழ் வகைப்படுத்தப்படுகிறது?", "a": "இது அட்டவணை 1.1 இன் படி, 'சமூகப் பொருளாதாரச் சூழல்' (Socio-economic environment) எனும் காரணியின் கீழ் ஒரு உதாரணமாக வகைப்படுத்தப்படுகிறது."}, {"q": "ஆரோக்கியமான வாழ்க்கை முறையைப் பேணுவதற்கான 8 முக்கிய பழக்கவழக்கங்கள் யாவை?", "a": "1. சரியான உணவுப் பழக்கவழக்கங்களைக் கைகொள்ளல்<br>2. சுறுசுறுப்பான வாழ்க்கை முறையும் உடற்பயிற்சியும்<br>3. பொருத்தமான உடல் நிறைச் சுட்டியைப் (BMI) பேணல்<br>4. போதியளவு நித்திரையும் ஓய்வும்<br>5. எளிமையான வாழ்க்கை முறையைப் பின்பற்றுதல்<br>6. உள நெருக்கீட்டிலிருந்து (Stress) விடுபடல்<br>7. மதுபானம், போதைப்பொருள் மற்றும் புகைத்தல் தவிர்த்தல்<br>8. சமூகத்தால் ஏற்றுக்கொண்ட விதிமுறைகளைப் பின்பற்றல்"}, {"q": "வளர்ந்த ஒரு நபர் ஆரோக்கியமாக இருக்க ஒரு நாளைக்கு எவ்வளவு நேரம் உடற்பயிற்சி செய்ய வேண்டும்?", "a": "குறைந்தது 30 நிமிடங்கள் உடல் களைப்படையுமாறு சுறுசுறுப்பான செயல்களில் ஈடுபட வேண்டும்."}, {"q": "சிறுவர்கள் மற்றும் இளைஞர்கள் ஒரு நாளைக்கு எவ்வளவு நேரம் உடற்பயிற்சி செய்ய வேண்டும்?", "a": "குறைந்தது 60 நிமிடங்கள் உடற்பயிற்சி அல்லது விளையாட்டுகளில் ஈடுபடுவது அவசியமாகும்."}, {"q": "தினசரி உடற்பயிற்சியில் ஈடுபடுவதன் மூலம் எந்தெந்த தொற்றாத நோய்களைக் குறைக்கலாம்?", "a": "நீரிழிவு, புற்றுநோய், உயர் குருதி அமுக்கம், இதய நோய்கள் மற்றும் பாரிசவாதம்."}, {"q": "சுறுசுறுப்பான வாழ்க்கை முறையை வெளிப்படுத்தும் செயற்பாடுகள் எவை?", "a": "திட்டமிட்ட உடற்பயிற்சிகள் — ஓடுதல், துவிச்சக்கர வண்டி மிதித்தல், நீந்துதல், வேகமான நடை.<br>அன்றாட வாழ்க்கைச் செயல்கள் — படிகளைப் பயன்படுத்துதல் (Lift தவிர்த்தல்), வீட்டு வேலைகளைத் தாமே செய்தல், நடந்து செல்லல்."}, {"q": "வளர்ந்தவர்களுக்குத் தேவையான சராசரி நித்திரை நேரம் எவ்வளவு?", "a": "ஒரு நாளைக்கு 6 முதல் 8 மணித்தியாலங்கள் ஆழ்ந்த நித்திரை அவசியமாகும்."}, {"q": "நித்திரையின் போது உடலில் ஏற்படும் உடற்றொழிலியல் நன்மைகள் யாவை?", "a": "இழையங்கள் வளர்ச்சியடைவதுடன், பகல் நேரத்தில் சிதைந்த இழையங்கள் புதுப்பிக்கப்படுகின்றன. மேலும் ஞாபக சக்தியை மேம்படுத்தவும் இது உதவுகிறது."}, {"q": "போதியளவு நித்திரை இல்லாவிட்டால் ஒருவருக்கு ஏற்படும் பாதிப்புகள் எவை?", "a": "அதிக களைப்பு, செயல்களில் உதாசீனத் தன்மை, ஞாபக மறதி மற்றும் அடிக்கடி கோபம் ஏற்படுதல் போன்ற உள-உடல் பாதிப்புகள் ஏற்படும்."}, {"q": "மகாத்மா காந்தியால் முன்வைக்கப்பட்ட 'எளிமையான வாழ்க்கை முறை' என்பது எதனைக் குறிக்கும்?", "a": "அத்தியாவசியமான தேவைகளில் மாத்திரம் திருப்தியடைந்து, தேவையற்ற ஆடம்பரங்கள் மற்றும் மன அழுத்தங்களிலிருந்து விடுபட்டு மகிழ்ச்சியாக வாழ்வதைக் குறிக்கும்."}, {"q": "உள நெருக்கீடு (Stress) என்பதற்கு வழங்கக்கூடிய விளக்கம் யாது?", "a": "சவால்களை எதிர்கொள்ளும் போது நமது உடல் மற்றும் மனம் வெளிக்காட்டும் எதிர்வினையே (Reflections) உள நெருக்கீடு எனப்படும்."}, {"q": "உள நெருக்கீட்டிலிருந்து விடுபடுவதற்கான சிறந்த வழிமுறைகள் எவை?", "a": "நெருக்கீட்டிற்கான காரணங்களை இனங்காணல், முறையான நேர முகாமைத்துவம் மற்றும் எளிமையான வாழ்க்கை முறையைப் பின்பற்றுதல்."}, {"q": "போதைப்பொருள் மற்றும் புகைத்தல் பழக்கம் ஒருவரை எவ்வாறு பாதிக்கிறது?", "a": "இது உடல் மற்றும் உள நலத்தைப் பாதிப்பதுடன், குடும்பச் சிதைவு மற்றும் பொருளாதாரச் சீர்கேடுகளுக்கு வழிவகுக்கும்."}, {"q": "போதைப் பழக்கத்தினால் குறைந்த வருமானம் பெறுவோர் தமது வருமானத்தில் எவ்வளவு சதவீதத்தை இழக்கின்றனர்?", "a": "குறைந்த வருமானம் பெறுவோர் தமது வருமானத்தில் 50 சதவீதத்திற்கும் அதிகமான தொகையை மதுபானம் மற்றும் புகைத்தலுக்காகச் செலவிடுகின்றனர்."}, {"q": "இளைஞர்கள் போதைப் பாவனைக்கு ஈர்க்கப்படுவதற்குப் பிரதான காரணங்கள் எவை?", "a": "கவர்ச்சிகரமான விளம்பரங்கள், ஊடகங்களின் தாக்கம் மற்றும் சமவயதுக் குழுக்களின் (Peer groups) அழுத்தம்."}, {"q": "இலங்கையில் போதைப்பொருள் விளம்பரம் தொடர்பான சட்ட ரீதியான நிலைப்பாடு யாது?", "a": "மதுபானம் மற்றும் புகைத்தல் தொடர்பான நேரடி அல்லது மறைமுக விளம்பரங்கள் இலங்கையில் சட்டரீதியாக முற்றாகத் தடை செய்யப்பட்டுள்ளன."}, {"q": "புகைத்தல் பெட்டியின் மேற்பரப்பில் எவ்வகையான எச்சரிக்கைக் காட்சிகள் இருக்க வேண்டும்?", "a": "புகைத்தல் பெட்டியின் 70 சதவீத மேற்பரப்பில் புகைத்தலால் ஏற்படும் தீங்குகள் மற்றும் நோய்கள் பற்றிய எச்சரிக்கைப் படங்கள் காட்சிப்படுத்தப்பட வேண்டும்."}, {"q": "போதைப் பாவனையைக் குறைக்க அரசாங்கம் எடுக்கும் சில நடவடிக்கைகள் எவை?", "a": "விலையை அதிகரித்தல், விற்பனை நிலையங்களைக் குறைத்தல் மற்றும் சட்டங்களை வலுவாகச் செயற்படுத்துதல்."}, {"q": "சமூக விதிமுறைகளை (Social Norms) மீறுவதால் ஏற்படும் பாதிப்புகள் யாவை?", "a": "வாகன விபத்துகள், அகால மரணங்கள், சட்டச் சிக்கல்கள் மற்றும் சமூக மதிப்புக் குறைதல்."}, {"q": "பாதுகாப்பற்ற பாலியல் உறவுகளால் ஏற்படக்கூடிய பாரதூரமான விளைவுகள் யாவை?", "a": "பாலியல் நோய்கள் (STIs) பரவுதல், தேவையற்ற கருத்தரிப்பு மற்றும் சட்டவிரோத கருக்கலைப்பினால் ஏற்படும் மரணங்கள் அல்லது மலட்டுத்தன்மை."}, {"q": "தினசரிச் சீரான உணவில் உள்ளடக்கப்பட வேண்டிய ஐந்து முக்கிய உணவுப் பிரிவுகள் எவை?", "a": "தானியங்கள் மற்றும் கிழங்குகள் — அரிசி, குரக்கன், உருளைக்கிழங்கு.<br>பழங்கள் — மாம்பழம், வாழை.<br>காய்கறிகள் மற்றும் கீரைகள் — கரட், வல்லாரை.<br>புரத உணவுகள் — மீன், இறைச்சி, முட்டை, பருப்பு.<br>பால் மற்றும் பால் பொருட்கள் — பால், தயிர்."}, {"q": "ஞாபக சக்தியைப் பேண உதவும் ஆரோக்கியமான பழக்கம் எது?", "a": "தேவையான அளவு நேரத்தை நித்திரைக்காக ஒதுக்குதல்."}, {"q": "சவால்களை எதிர்கொள்ளும் திறன் நபருக்கு நபர் எவ்வாறு வேறுபடுகிறது?", "a": "தனிநபர் தயார் நிலையில் இது தங்கியுள்ளது. உதாரணமாக, பரீட்சைக்குத் திட்டமிட்டுப் படிப்பவருக்குப் பரீட்சை ஒரு சவாலாகத் தோன்றாது, ஆனால் திட்டமிடாதவருக்கு அது உள நெருக்கீட்டைத் தரும்."}, {"q": "உடல் நிறைச் சுட்டியைச் சரியான மட்டத்தில் பேண உதவுவன எவை?", "a": "சரியான உணவுப் பழக்கம், அன்றாடச் சுறுசுறுப்பு மற்றும் முறையான உடற்பயிற்சி."}, {"q": "பூரண சுகாதாரம் அடையத் தவிர்க்கப்பட வேண்டிய சமூகச் சீர்கேடுகள் எவை?", "a": "மதுபானம், போதைப்பொருள் பாவனை, புகைத்தல் மற்றும் பாதுகாப்பற்ற பாலியல் தொடர்புகள்."}, {"q": "இலங்கையில் பொது இடங்களில் புகைபிடித்தல் தண்டனைக்குரிய குற்றமா?", "a": "ஆம், சட்டத்தை மீறுவதால் மற்றவர்களின் ஆரோக்கியம் பாதிக்கப்படுவதால் இது தண்டனைக்குரிய குற்றமாகும்."}, {"q": "உடல் நிறைச் சுட்டியைக் (BMI) கணக்கிடுவதற்கான சர்வதேசச் சூத்திரம் யாது?", "a": "BMI = \\frac{உடல் நிறை (kg)}{உயரம் (m)^2}"}, {"q": "சிறுவர்களுக்கான BMI அளவீடு ஏன் வயது மற்றும் பாலிற்கு ஏற்ப மாறுபடுகிறது?", "a": "சிறுவர்களின் வளர்ச்சி வேகமானது மற்றும் வயது, பால் (ஆண்/பெண்) ஆகியவற்றிற்கு ஏற்ப அவர்களின் உடல் வளர்ச்சி மாற்றமடைவதால், அவர்களுக்கு நிலையான பெறுமானங்களுக்குப் பதிலாக SD வளைவுகள் (Standard Deviation curves) பயன்படுத்தப்படுகின்றன."}, {"q": "5-19 வயதுக்குட்பட்ட பிள்ளைகளின் BMI வளைவில் 'சாதாரண நிறை' என்பதைக் குறிக்கும் நிறம் மற்றும் எல்லை யாது?", "a": "பச்சை நிறம்; இது -2 SD முதல் +1 SD வரையிலான எல்லையாகும்."}, {"q": "சிறுவர்களின் BMI வகைப்பாட்டில் 'குறைவான நிறை' எதனைத் தாண்டும் போது தீர்மானிக்கப்படுகிறது?", "a": "-2 SD க்குக் கீழ் செல்லும் போது (செம்மஞ்சள் நிறம்)."}, {"q": "சிறுவர்களின் BMI வளைவில் 'அதிக நிறை' மற்றும் 'பருத்த உடல்' ஆகியவற்றுக்குரிய நிறங்கள் எவை?", "a": "அதிக நிறை - இளம் ஊதா நிறம் (+1 SD முதல் +2 SD வரை); பருத்த உடல் - கடும் ஊதா நிறம் (+2 SD இலும் அதிகம்)."}, {"q": "வளர்ந்தோருக்கான BMI வகைப்பாட்டில் ஆசிய அளவீடு ஏன் சர்வதேச அளவீட்டை விடக் குறைவாக உள்ளது?", "a": "ஆசியர்களின் உடல் அமைப்பின் படி, குறைந்த BMI மட்டத்திலேயே தொற்றாத நோய்கள் ஏற்படும் அபாயம் அதிகம் என்பதால் ஆசிய அளவீடு கடுமையாகப் பின்பற்றப்படுகிறது."}, {"q": "வளர்ந்தோருக்கான BMI வகைப்பாட்டு அட்டவணை (ஆசிய vs சர்வதேச):", "a": "குறைவான நிறை (Wasting): ஆசிய < 18.5; சர்வதேச < 18.5 kg/m².<br>சாதாரண நிறை: ஆசிய 18.5–22.9; சர்வதேச 18.5–24.9 kg/m².<br>அதிக நிறை (Overweight): ஆசிய 23.0–26.9; சர்வதேச 25.0–29.9 kg/m².<br>பருத்த உடல் (Obesity): ஆசிய > 27.0; சர்வதேச > 30.0 kg/m²."}, {"q": "உடல் நிறைச் சுட்டி (BMI) அதிகரிப்பதனால் ஏற்படக்கூடிய பிரதான ஆரோக்கிய அபாயங்கள் எவை?", "a": "நீரிழிவு, உயர் குருதி அமுக்கம், இதய நோய்கள், புற்றுநோய் மற்றும் பாரிசவாதம் போன்ற தொற்றாத நோய்கள் (NCDs)."}, {"q": "BMI அதிகமாக உள்ள ஒரு மாணவன் அதனைச் சீர்செய்ய எடுக்க வேண்டிய நடவடிக்கைகள் எவை?", "a": "உணவுக் கட்டுப்பாடு, இனிப்பு மற்றும் கொழுப்பு உணவுகளைக் குறைத்தல், அன்றாட உடற்பயிற்சி மற்றும் சுறுசுறுப்பான வாழ்க்கை முறை."}, {"q": "BMI கணக்கீட்டில் 'Wasting' என்பது எதனைக் குறிக்கிறது?", "a": "இது போஷணைக் குறைபாட்டினால் ஏற்படும் 'தேய்வு' அல்லது 'குறைவான நிறை' நிலையைக் குறிக்கிறது."}, {"q": "வளர்ந்தோரின் BMI வகைப்பாட்டில் வயது மற்றும் பால் செல்வாக்கு செலுத்துமா?", "a": "இல்லை, வளர்ந்தோரைப் பொறுத்தவரை BMI எல்லைப் பெறுமானங்கள் வயது அல்லது பாலிற்கு ஏற்ப வேறுபடுவதில்லை."}, {"q": "BMI வரைபடத்தில் பயன்படுத்தப்படும் நிறங்களின் நோக்கம் என்ன?", "a": "பெற்றோர்கள் மற்றும் மாணவர்கள் தமது போஷணை மட்டத்தை மிக எளிதாகவும் விரைவாகவும் இனங்காண இது உதவுகிறது."}, {"q": "சிறுவர்கள் மற்றும் வளர்ந்தோர் இருவருக்குமே BMI கணக்கிடப்படுவது ஏன் முக்கியம்?", "a": "ஒருவரின் போஷணை மட்டம் சரியான நிலையில் உள்ளதா என்பதைக் கண்டறியவும், எதிர்கால நோய்ப் பாதிப்புகளைத் தடுக்கவும் இது முக்கியமாகும்."}, {"q": "BMI கணக்கிடும் போது உயரம் எந்த அலகில் இருக்க வேண்டும்?", "a": "உயரம் மீட்டர் (m) அலகில் கணக்கிடப்பட வேண்டும்."}, {"q": "உடல் பருமனைக் குறைப்பதில் உடற்பயிற்சியுடன் சேர்த்து கவனிக்கப்பட வேண்டிய மற்றொரு அம்சம் எது?", "a": "முறையான உணவு முகாமைத்துவம் (Dietary management).\n\n\nசனத்தொகை அடர்த்தி (Population Density)"}, {"q": "சனத்தொகை அடர்த்தி என்றால் என்ன? அது ஆரோக்கியத்தை எவ்வாறு பாதிக்கிறது?", "a": "ஓர் அலகுப் பரப்பினுள் வாழ்கின்ற மக்களின் எண்ணிக்கை சனத்தொகை அடர்த்தியாகும். இது அதிகரிப்பதால் சுவாச மற்றும் சமீபாட்டுத் தொகுதி நோய்கள் விரைவாகப் பரவும் வாய்ப்பு ஏற்படுகிறது."}, {"q": "அடர்த்தியான சனத்தொகை உள்ள இடங்களில் ஏற்படும் உளவியல் பாதிப்பு யாது?", "a": "நெருக்கடியான வாழ்க்கைச் சூழல் மற்றும் இடவசதி இல்லாமை காரணமாக மன நெருக்கீடுகள் (Stress) அதிகரிக்கின்றன."}, {"q": "சனத்தொகை அடர்த்திக்கு ஏற்ப மேற்கொள்ள வேண்டிய சுகாதாரத் திட்டமிடல் யாது?", "a": "போதுமான சுகாதார மையங்கள், தூய குடிநீர் வசதிகள் மற்றும் முறையான வீடமைப்புத் திட்டங்களை உருவாக்குதல்.தொழில்நுட்பம் மற்றும் ஊடகங்கள் (Technology and Media)"}, {"q": "தொழில்நுட்ப வளர்ச்சியின் பாதகமான ஆரோக்கிய விளைவு யாது?", "a": "நவீன உபகரணங்களின் பாவனையினால் உடல் உழைப்பு குறைந்து, உடலியக்கமற்ற வாழ்க்கை முறையினால் தொற்றாத நோய்கள் அதிகரிக்கின்றன."}, {"q": "ஊடக விளம்பரங்கள் பிள்ளைகளின் உணவுப் பழக்கத்தை எவ்வாறு மாற்றியமைக்கின்றன?", "a": "கவர்ச்சிகரமான விளம்பரங்கள் மூலம் உடனடி உணவுகள் (Fast food) மற்றும் செயற்கை இனிப்பு உணவுகளின் மீது பிள்ளைகளுக்குத் தவறான ஈர்ப்பை ஏற்படுத்துகின்றன."}, {"q": "தொழில்நுட்பம் மற்றும் ஊடகங்களைச் சுகாதார மேம்பாட்டிற்கு எவ்வாறு சாதகமாகப் பயன்படுத்தலாம்?", "a": "தொலைபேசி மற்றும் இணையம் மூலம் நோய்கள் பற்றிய விழிப்புணர்வு, ஆரோக்கியமான சமையல் முறைகள் மற்றும் உடற்பயிற்சி ஆலோசனைகளை மக்களுக்கு வழங்கலாம்.உலகமயமாதல் மற்றும் கலாசாரம் (Globalization and Culture)"}, {"q": "பூகோள கிராமம் (Global Village) என்பது பூரண சுகாதாரத்தில் எத்தகைய தாக்கத்தை ஏற்படுத்துகிறது?", "a": "தகவல் தொடர்பு வளர்ச்சியால் ஒரு நாட்டில் ஏற்படும் தொற்று நோய்கள் மற்றும் ஆரோக்கியமற்ற வாழ்க்கை முறைகள் உலகம் முழுவதும் மிக விரைவாகப் பரவுகின்றன."}, {"q": "போட்டித்தன்மையான வாழ்க்கை முறையினால் குடும்ப உறவுகளில் ஏற்படும் மாற்றம் யாது?", "a": "கல்வி மற்றும் தொழிலுக்காக அதிக நேரம் செலவிடுவதால் ஓய்வு குறைகிறது, இதனால் குடும்ப உறுப்பினர்களிடையே இருக்க வேண்டிய ஆளுமைத் தொடர்புகள் (Interpersonal relations) பலவீனமடைகின்றன.சுற்றுலாத்துறை (Tourism)"}, {"q": "சுற்றுலாத் துறையினால் ஏற்படும் சாதகமான விளைவுகள் எவை?", "a": "நாட்டின் வருமானம் அதிகரித்தல், உட்கட்டமைப்பு வசதிகள் மேம்படுதல் மற்றும் பல்வேறு கலாசார மக்களிடையே நல்லுறவு ஏற்படுதல்."}, {"q": "சுற்றுலாத் துறையினால் ஏற்படக்கூடிய சுகாதாரச் சவால்கள் எவை?", "a": "சட்டவிரோத போதைப்பொருள் கடத்தல், கலாசாரச் சீரழிவு, பாலியல் நோய்கள் பரவல் மற்றும் சூழல் மாசடைதல்.போர் மற்றும் இயற்கை அனர்த்தங்கள் (War and Natural Disasters)"}, {"q": "போர் மற்றும் இயற்கை அனர்த்தங்கள் ஒரு சமூகத்தின் சுகாதாரத்தை எவ்வாறு பாதிக்கின்றன?", "a": "மக்கள் அகதிகளாவதால் முறையான சுகாதார சேவைகள் தடைப்படுகின்றன; அத்துடன் பாரிய உளச் சமூகப் பாதிப்புகளும் தொற்றுநோய் பரவலும் ஏற்படுகின்றன."}, {"q": "அகதிகளாக்கப்பட்ட மக்களின் ஆரோக்கியத்தைப் பாதுகாக்க அரசாங்கம் செய்ய வேண்டியது யாது?", "a": "அவர்களுக்கான விசேட சேமநலத் திட்டங்களை மேம்படுத்துதல் மற்றும் அடிப்படை சுகாதாரத் தேவைகளை உறுதிப்படுத்துதல்.ஆரோக்கிய மேம்பாடும் கல்வியும் (Health Promotion and Education)"}, {"q": "கல்வித் தரம் ஒரு நாட்டின் சுகாதார நிலையில் எத்தகைய மாற்றத்தை ஏற்படுத்துகிறது?", "a": "மக்களின் கல்வி அறிவு அதிகரிக்கும் போது சிசு மரண வீதம் குறைகிறது, சராசரி ஆயுட்காலம் அதிகரிக்கிறது மற்றும் சுகாதார விழிப்புணர்வு மேம்படுகிறது."}, {"q": "இலங்கையின் சிறந்த சுகாதார நிலைக்குக் காரணமாக உள்ள கொள்கை யாது?", "a": "அனைத்து மக்களுக்கும் தகுதியான மற்றும் தரமான சுகாதாரச் சேவைகள் இலவசமாக வழங்கப்படுவதாகும்."}, {"q": "குடும்பநல சுகாதார உத்தியோகத்தர் (PHM) மற்றும் பொதுச்சுகாதாரப் பரிசோதகர் (PHI) ஆகியோரின் முக்கியப் பணி யாது?", "a": "தேசிய நோய்த்தடுப்புத் திட்டம், தாய் - சேய் நலச் சேவைகள் மற்றும் சூழல் சுகாதாரத்தைப் பேணுதல்.சவால்களை வெற்றிகொள்ளல் (How to Overcome)"}, {"q": "கல்வித் துறையில் சுகாதாரச் சவால்களை எதிர்கொள்ள எடுக்கப்பட்டுள்ள நடவடிக்கை யாது?", "a": "தரம் 10 மற்றும் 11 வகுப்பு மாணவர்களுக்கு 'சுகாதாரமும் உடற்கல்வியும்' பாடத்தைக் கட்டாயப்படுத்துவதன் மூலம் சிறுவயதிலேயே விழிப்புணர்வை ஏற்படுத்துதல்."}, {"q": "சனத்தொகை அடர்த்தியினால் ஏற்படும் சுகாதாரப் பாதிப்புகளைக் கண்டறிய வேண்டிய அவசியம் என்ன?", "a": "இது தொடர்பான முறையான ஆய்வுகளை மேற்கொள்வதன் மூலம் சுகாதாரச் செயற்பாட்டுக் குழுக்களின் எண்ணிக்கையைத் திட்டமிட்டு அதிகரிக்க முடியும்."}, {"q": "தொழில்நுட்பம் மற்றும் ஊடகத் தாக்கத்திலிருந்து தப்ப மாணவர்களுக்கு வழங்கப்பட வேண்டிய அறிவு எது?", "a": "சரியான மற்றும் தவறான ஊடகத் தகவல்களைப் பகுத்தறியும் திறன் மற்றும் ஊடகக் கல்வி (Media Literacy) மூலம் விழிப்புணர்வு ஊட்டல்."}, {"q": "ஆரோக்கியமான வாழ்க்கை முறையை ஊக்குவிக்க அரசாங்கம் செய்யக்கூடிய பொருளாதார மாற்றம் யாது?", "a": "மக்களின் பொருளாதார நிலையை உயர்த்துவதுடன், சத்தான உணவுகள் எளிதாகக் கிடைப்பதை உறுதிப்படுத்தல்."}, {"q": "பூரண சுகாதாரம் நோக்கிய பயணத்தில் இறுதித் தீர்வு எது?", "a": "தனிநபர்கள் சவால்களைச் சரியாக இனங்கண்டு, ஆரோக்கியமான நடத்தைக் கோலங்களைச் சுயமாகப் பின்பற்றும் ஒரு சமூக விழிப்புணர்வை ஏற்படுத்துவதே இறுதித் தீர்வாகும்."}];

    document.getElementById("answer").style.display = "none";
    document.getElementById("showBtn").textContent = "👁️ Show Answer";
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function showAnswer() {
    const answer = document.getElementById("answer");
    const btn = document.getElementById("showBtn");

    if (answer.style.display === "none") {
        answer.style.display = "block";
        btn.textContent = "🙈 Hide Answer";
    } else {
        answer.style.display = "none";
        btn.textContent = "👁️ Show Answer";
    }
}

function nextCard() {
    current = (current + 1) % cards.length;
    renderCard();
}

function previousCard() {
    current = (current - 1 + cards.length) % cards.length;
    renderCard();
}

document.addEventListener("keydown", function(event) {
    if (event.key === "ArrowRight") nextCard();
    if (event.key === "ArrowLeft") previousCard();
    if (event.key === " " || event.key === "Enter") {
        if (document.activeElement.tagName !== "BUTTON") showAnswer();
    }
});

renderCard();
</script>

</body>
</html>
